name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test release workflow helpers
        run: node --test tests/workflows/*.test.mjs

      - uses: ./.github/actions/setup-android

      - name: Restore and build
        run: |
          set -euo pipefail
          dotnet restore Centello.slnx
          config=$(mktemp -d)
          trap 'rm -rf -- "$config"' EXIT
          node .github/scripts/stage-firebase-config.mjs dev "$config/firebase.json" --synthetic
          dotnet build Centello.slnx -c Debug --no-restore "-p:FirebaseAndroidConfigFile=$config/firebase.json"
          app=src/Centello.App/bin/Debug/net10.0-android/it.christiancapoccetti.centesimo.dev-Signed.apk
          if ! unzip -p "$app" assets/firebase-android.json | cmp -s "$config/firebase.json" -; then
            echo "::error::The development APK must contain the staged Firebase options."
            exit 1
          fi

      - name: Check development package identity
        shell: pwsh
        run: ./tests/android/check-variant.ps1 -Manifest src/Centello.App/obj/Debug/net10.0-android/android/AndroidManifest.xml -Variant Dev

      - name: Run tests with branch and line coverage
        id: tests
        run: |
          dotnet test Centello.slnx -c Debug --no-build --no-restore \
            --results-directory TestResults --collect:"XPlat Code Coverage;Format=opencover"

      - name: Merge coverage reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --framework net10.0 --tool-path "$RUNNER_TEMP/report-tools"
          "$RUNNER_TEMP/report-tools/reportgenerator" \
            "-reports:TestResults/*/coverage.opencover.xml" \
            "-assemblyfilters:+Centello.Domain;+Centello.Application;+Centello.Infrastructure" \
            "-targetdir:Coverage" "-reporttypes:Cobertura;MarkdownSummaryGithub"
          cat Coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage includes every tested assembly
        shell: pwsh
        run: |
          $report = [xml](Get-Content -Raw Coverage/Cobertura.xml)
          $expected = @('Centello.Application', 'Centello.Domain', 'Centello.Infrastructure')
          $packages = @($report.SelectNodes('/coverage/packages/package'))
          $measured = @($packages | Where-Object { $_.SelectSingleNode('classes/class/lines/line') } | ForEach-Object { $_.name })
          if ($packages.Count -ne $expected.Count -or (Compare-Object $expected $measured -CaseSensitive)) {
            throw "Incomplete coverage. Expected $($expected -join ', '). Measured: $($measured -join ', ')."
          }

      - name: Build and verify Play bundle with a temporary key
        env:
          PLAY_PACKAGE: it.christiancapoccetti.centesimo
        run: |
          set -euo pipefail
          umask 077
          signing=$(mktemp -d)
          trap 'rm -rf -- "$signing"' EXIT
          export PLAY_UPLOAD_KEYSTORE="$signing/upload.jks"
          export CENTELLO_INVITE_PUBLIC_KEY
          CENTELLO_INVITE_PUBLIC_KEY=$(node -e "const k=require('node:crypto').generateKeyPairSync('ed25519').publicKey.export({format:'jwk'});process.stdout.write(Buffer.from(k.x,'base64url').toString('base64'))")
          export PLAY_UPLOAD_PASSWORD_FILE="$signing/password"
          printf '%s' 'centello-ci-key' > "$PLAY_UPLOAD_PASSWORD_FILE"
          keytool -genkeypair -storetype JKS -keystore "$PLAY_UPLOAD_KEYSTORE" \
            -storepass:file "$PLAY_UPLOAD_PASSWORD_FILE" -keypass:file "$PLAY_UPLOAD_PASSWORD_FILE" \
            -alias upload -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Centello CI'
          export FirebaseAndroidConfigFile="$signing/firebase.json"
          node .github/scripts/stage-firebase-config.mjs play "$FirebaseAndroidConfigFile" --synthetic
          bash .github/scripts/build-play-bundle.sh "$signing/app.aab" 3 1.2.0

      - name: Offer release of the verified main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '[Rilascia app](%s/%s/releases/new?target=%s&prerelease=1) · `%s`\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
