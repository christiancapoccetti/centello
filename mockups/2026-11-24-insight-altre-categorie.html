<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centello · Altre categorie in Insight</title>
  <style>
    @font-face {font-family:Archivo;src:url(../src/Centello.App/Resources/Fonts/Archivo-Regular.ttf)}
    @font-face {font-family:Archivo;src:url(../src/Centello.App/Resources/Fonts/Archivo-SemiBold.ttf);font-weight:600}
    @font-face {font-family:Archivo;src:url(../src/Centello.App/Resources/Fonts/Archivo-Bold.ttf);font-weight:700}
    @font-face {font-family:Symbols;src:url(../src/Centello.App/Resources/Fonts/MaterialSymbolsRounded-Filled.ttf)}
    * {box-sizing:border-box}
    [hidden] {display:none!important}
    :root {--ink:#f4f4f0;--mute:#a0a3a9;--line:#2a2c2f;--ground:#141516}
    body {margin:0;background:#e9e9e4;color:#171817;font:16px/1.4 Archivo,Arial,sans-serif;font-variant-numeric:tabular-nums}
    .board {width:min(100%,460px);margin:clamp(16px,7vh,76px) auto;padding:0 16px}
    .mast {display:flex;align-items:center;gap:6px;padding:0 5px 15px;font-size:20px;font-weight:700;letter-spacing:-.03em}
    .mast img {width:33px;height:33px}
    .mast small {margin-left:auto;font-size:12px;font-weight:400;letter-spacing:0;color:#51544f}
    main,dialog {background:var(--ground);color:var(--ink);color-scheme:dark}
    main {border-radius:20px;padding:23px 24px 13px;overflow-anchor:none}
    h1,h2,p,ul {margin:0}
    h1 {font-size:20px;line-height:1.25}
    .period {margin:14px 0 22px;color:var(--mute);font-size:13px}
    .period b {color:var(--ink)}
    h2 {font-size:18px}
    .statement {margin:6px 0 4px;font-size:20px;line-height:1.25}
    .context,.legend {font-size:13px;color:var(--mute)}
    .legend {display:flex;align-items:center;flex-wrap:wrap;gap:5px 14px;margin:16px 0 4px}
    .previous {display:inline-flex;align-items:center;gap:5px}
    .previous::before {content:"";width:2px;height:10px;background:var(--ink)}
    ul {list-style:none;padding:0}
    button {font:inherit;color:inherit;border:0;background:transparent;cursor:pointer}
    button:focus-visible {outline:2px solid #8fa8ff;outline-offset:2px}
    button:hover {background:#202123}
    .row {display:grid;grid-template-columns:24px 1fr auto auto;align-items:center;gap:5px 8px;width:100%;min-height:50px;padding:7px 0 6px;text-align:left}
    .tile {display:grid;place-items:center;width:24px;height:24px;background:var(--color);color:#141516;font:16px Symbols}
    .name {font-weight:600;overflow-wrap:anywhere}
    .amount {font-size:13px;color:var(--mute)}
    .share {font-size:14px;font-weight:700}
    .track {position:relative;grid-column:1/-1;height:6px;background:var(--line)}
    .track::before {content:"";display:block;width:var(--share);height:100%;background:var(--color)}
    .track::after {content:"";position:absolute;inset-block:0;left:clamp(0px,calc(var(--previous) - 1px),calc(100% - 2px));width:2px;background:var(--ink)}
    .toggle {width:100%;display:flex;align-items:center;justify-content:space-between;min-height:48px;border-top:1px solid var(--line);margin:8px 0 0;padding:0;text-align:left;font-weight:600}
    .chevron {font:21px Symbols;color:var(--mute)}
    [aria-expanded=true] .chevron {transform:rotate(180deg)}
    dialog {width:min(350px,calc(100% - 32px));padding:24px;border:1px solid #3a3d41;border-radius:16px}
    dialog::backdrop {background:#0009}
    dialog p {margin-top:10px}
    dialog button {margin-top:18px;min-height:48px;padding:0 16px;border:1px solid #55585e;border-radius:8px}
    @media(max-width:480px) {body {background:var(--ground)}.board {margin:0;padding:0}.mast {background:#e9e9e4;padding:7px 16px}.mast img {width:26px;height:26px}main {border-radius:0}}
  </style>
</head>
<body>
  <div class="board">
    <header class="mast"><img src="../docs/brand/segno-colore-su-chiaro.svg" alt="">Centello <small>Mockup · Dati di esempio</small></header>
    <main>
      <h1>Insight</h1>
      <p class="period">1–24 novembre 2026 · <b>500 € spesi</b></p>
      <h2>Dove sono finiti i soldi?</h2>
      <p class="statement">Il <b>40%</b> della spesa è andato in alimentari.</p>
      <p class="context">Negli stessi giorni di ottobre la quota era del 35%.</p>
      <p class="legend"><span>Quota a novembre</span><span class="previous">Quota a ottobre</span></p>
      <ul id="categories" aria-label="Categorie in ordine di spesa"></ul>
      <button type="button" class="toggle" id="toggle" aria-expanded="false" aria-controls="categories"><span></span><i class="chevron" aria-hidden="true">&#xe5cf;</i></button>
    </main>
  </div>
  <dialog aria-labelledby="detail-title"><h2 id="detail-title"></h2><p id="current"></p><p id="prior"></p><form method="dialog"><button>Chiudi</button></form></dialog>
  <script>
    const categories = [
      {name:"Alimentari", amount:200, prior:175, color:"#6ed3a6", icon:"\ue8cc"},
      {name:"Ristoranti", amount:100, prior:125, color:"#f5d06b", icon:"\ue56c"},
      {name:"Trasporti", amount:80, prior:70, color:"#8ea6ff", icon:"\ue530"},
      {name:"Bollette", amount:60, prior:50, color:"#d4a8f0", icon:"\uea0b"},
      {name:"Tempo libero", amount:40, prior:60, color:"#8fd0f0", icon:"\ue638"},
      {name:"Abbigliamento", amount:20, prior:20, color:"#ff8a7a", icon:"\uf19e"}
    ];
    const initialCount = 3;
    const total = categories.reduce((sum, row) => sum + row.amount, 0);
    const priorTotal = categories.reduce((sum, row) => sum + row.prior, 0);
    const list = document.querySelector("#categories");
    const toggle = document.querySelector("#toggle");
    const dialog = document.querySelector("dialog");
    for (const row of categories) {
      const share = 100 * row.amount / total;
      const priorShare = 100 * row.prior / priorTotal;
      const item = document.createElement("li");
      item.style.setProperty("--color", row.color);
      item.style.setProperty("--share", share + "%");
      item.style.setProperty("--previous", priorShare + "%");
      item.innerHTML = `<button type="button" class="row" aria-label="${row.name}, ${row.amount} euro, ${share}% a novembre e ${priorShare}% a ottobre">
        <span class="tile" aria-hidden="true">${row.icon}</span><span class="name">${row.name}</span>
        <span class="amount">${row.amount} €</span><span class="share">${share}%</span><span class="track" aria-hidden="true"></span></button>`;
      item.querySelector("button").onclick = () => {
        document.querySelector("#detail-title").textContent = row.name;
        document.querySelector("#current").textContent = `1–24 novembre · ${row.amount} € (${share}%)`;
        document.querySelector("#prior").textContent = `1–24 ottobre · ${row.prior} € (${priorShare}%)`;
        dialog.showModal();
      };
      list.append(item);
    }
    function expand(open) {
      const extra = Math.max(0, list.children.length - initialCount);
      [...list.children].forEach((item, index) => { item.hidden = !open && index >= initialCount; });
      toggle.hidden = extra === 0;
      toggle.setAttribute("aria-expanded", String(open));
      toggle.firstElementChild.textContent = open ? "Mostra solo le prime 3" :
        extra === 1 ? "Mostra un’altra categoria" : `Mostra altre ${extra} categorie`;
    }
    toggle.onclick = event => {
      const open = toggle.getAttribute("aria-expanded") === "false";
      expand(open);
      if (open && event.detail === 0) list.children[initialCount].querySelector("button").focus();
    };
    expand(false);
  </script>
</body>
</html>
